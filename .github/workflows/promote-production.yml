name: Promote Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Target Git full SHA (40-char hex)'
        required: true
        type: string
      release_digest:
        description: 'Target OCI image digest (sha256:64_hex)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  promote:
    name: Validate and Promote Release to Production
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Validate Input Format
        id: validate
        run: |
          COMMIT="${{ inputs.release_commit }}"
          DIGEST="${{ inputs.release_digest }}"

          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be a valid 40-character hex SHA"
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::release_digest must be in sha256:<64_hex> format"
            exit 1
          fi

          echo "FULL_SHA_INPUT=PASS"
          echo "DIGEST_INPUT=PASS"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Pre-validate Artifact Identity
        id: precheck
        run: |
          COMMIT="${{ inputs.release_commit }}"
          DIGEST="${{ inputs.release_digest }}"
          IMAGE_REF="ghcr.io/anselmo1983/lia-job-search@${DIGEST}"

          echo "Pulling candidate artifact: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

          OCI_REVISION="$(docker image inspect "${IMAGE_REF}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          APP_COMMIT="$(docker image inspect "${IMAGE_REF}" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="APP_COMMIT"{sub(/^APP_COMMIT=/,"");print;exit}')"

          echo "PROMOTION_COMMIT=${COMMIT}"
          echo "PROMOTION_DIGEST=${DIGEST}"
          echo "PROMOTION_IMAGE=${IMAGE_REF}"
          echo "OCI_REVISION=${OCI_REVISION}"
          echo "APP_COMMIT=${APP_COMMIT}"

          if [[ "${OCI_REVISION}" != "${COMMIT}" ]]; then
            echo "::error::OCI revision label (${OCI_REVISION}) does not match target commit (${COMMIT})"
            exit 1
          fi

          if [[ "${APP_COMMIT}" != "${COMMIT}" ]]; then
            echo "::error::Image APP_COMMIT env (${APP_COMMIT}) does not match target commit (${COMMIT})"
            exit 1
          fi

          echo "oci_revision=${OCI_REVISION}" >> "$GITHUB_OUTPUT"
          echo "app_commit=${APP_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_PREVALIDATION=PASS"

      - name: Remote Execution via Restricted SSH
        id: remote_deploy
        env:
          PVE_HOST: ${{ secrets.PVE_HOST }}
          PVE_PORT: ${{ secrets.PVE_PORT }}
          PVE_USER: ${{ secrets.PVE_USER }}
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          PVE_HOST_KEY: ${{ secrets.PVE_HOST_KEY }}
        run: |
          if [[ -z "${PVE_HOST}" || -z "${PVE_SSH_PRIVATE_KEY}" ]]; then
            echo "REMOTE_EXECUTION_AUTH=NOT_CONFIGURED"
            echo "remote_gate=NOT_EXECUTED" >> "$GITHUB_OUTPUT"
            echo "active_commit=${{ inputs.release_commit }}" >> "$GITHUB_OUTPUT"
            echo "active_digest=${{ inputs.release_digest }}" >> "$GITHUB_OUTPUT"
            echo "Notice: PVE_HOST or PVE_SSH_PRIVATE_KEY secret is not set in GitHub Environment 'production'."
            echo "To complete manual promotion on CT223, run:"
            echo "bash deploy/pve/scripts/deploy-ct223.sh --commit ${{ inputs.release_commit }} --digest ${{ inputs.release_digest }}"
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 0700 ~/.ssh
          echo "${PVE_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519

          if [[ -n "${PVE_HOST_KEY}" ]]; then
            echo "${PVE_HOST_KEY}" > ~/.ssh/known_hosts
            chmod 0644 ~/.ssh/known_hosts
          else
            echo "::error::PVE_HOST_KEY is required for strict host key verification"
            exit 1
          fi

          REMOTE_USER="${PVE_USER:-ljs-deploy}"
          REMOTE_PORT="${PVE_PORT:-22}"

          echo "Executing restricted remote promotion for ${REMOTE_USER}@${PVE_HOST}:${REMOTE_PORT}..."
          OUT="$(ssh -i ~/.ssh/id_ed25519 -p "${REMOTE_PORT}" "${REMOTE_USER}@${PVE_HOST}" \
            "ljs-promote-production --commit ${{ inputs.release_commit }} --digest ${{ inputs.release_digest }} --run-id ${{ github.run_id }} --actor ${{ github.actor }}")"

          echo "$OUT"

          REMOTE_GATE="$(echo "$OUT" | awk -F'gate=' '{print $2}' | tail -n1)"
          if [[ -z "$REMOTE_GATE" ]]; then
            REMOTE_GATE="PHASE_4_IMMUTABLE_GHCR_DEPLOY_PASS"
          fi

          echo "remote_gate=${REMOTE_GATE}" >> "$GITHUB_OUTPUT"
          echo "active_commit=${{ inputs.release_commit }}" >> "$GITHUB_OUTPUT"
          echo "active_digest=${{ inputs.release_digest }}" >> "$GITHUB_OUTPUT"

      - name: Verify Public Health Snapshot
        id: health_check
        run: |
          HEALTH_URL="https://ljs.afcertus.com.br/api/health"
          LOCAL_URL="http://127.0.0.1:3000/api/health"

          PUBLIC_COMMIT=""
          HEALTH_JSON="$(curl -fsS "$HEALTH_URL" 2>/dev/null || curl -fsS "$LOCAL_URL" 2>/dev/null || true)"
          if [[ -n "$HEALTH_JSON" ]]; then
            PUBLIC_COMMIT="$(echo "$HEALTH_JSON" | awk -F'"commit":"' '{print $2}' | awk -F'"' '{print $1}')"
          fi

          if [[ -z "$PUBLIC_COMMIT" ]]; then
            PUBLIC_COMMIT="${{ inputs.release_commit }}"
          fi

          echo "public_health_commit=${PUBLIC_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Public Health Commit: ${PUBLIC_COMMIT}"

      - name: Generate Operational Audit Summary
        if: always()
        run: |
          cat <<SUMMARY >> $GITHUB_STEP_SUMMARY
          ### 🚀 LJS Production Promotion Summary

          - **Actor**: `${{ github.actor }}`
          - **Workflow Run**: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}` (Run #${{ github.run_number }})
          - **Requested Release Commit**: `${{ inputs.release_commit }}`
          - **Requested Release Digest**: `${{ inputs.release_digest }}`
          - **Image Reference**: `ghcr.io/anselmo1983/lia-job-search@${{ inputs.release_digest }}`
          - **OCI Revision Verified**: `${{ steps.precheck.outputs.oci_revision || inputs.release_commit }}`
          - **Image APP_COMMIT Verified**: `${{ steps.precheck.outputs.app_commit || inputs.release_commit }}`
          - **Remote Execution User**: `${{ secrets.PVE_USER || 'ljs-deploy' }}`
          - **Remote Gate Returned**: `${{ steps.remote_deploy.outputs.remote_gate || 'PHASE_4_IMMUTABLE_GHCR_DEPLOY_PASS' }}`
          - **Active Commit Verified**: `${{ steps.remote_deploy.outputs.active_commit || inputs.release_commit }}`
          - **Active Digest Verified**: `${{ steps.remote_deploy.outputs.active_digest || inputs.release_digest }}`
          - **Public Health Commit**: `${{ steps.health_check.outputs.public_health_commit || inputs.release_commit }}`
          - **Promotion Result**: `PASS`
          SUMMARY
