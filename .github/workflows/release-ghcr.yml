name: Release GHCR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: release-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anselmo1983/lia-job-search
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image release information
        run: |
          echo "RELEASE_COMMIT=${{ github.sha }}"
          echo "RELEASE_IMAGE=ghcr.io/anselmo1983/lia-job-search:${{ github.sha }}"
          echo "RELEASE_DIGEST=${{ steps.build.outputs.digest }}"

      - name: Auto-trigger production promotion
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const digest = '${{ steps.build.outputs.digest }}';
            const sha = '${{ github.sha }}';
            if (!digest || !digest.startsWith('sha256:')) {
              core.setFailed(`Invalid digest: ${digest}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'promote-production.yml',
              ref: 'master',
              inputs: {
                release_commit: sha,
                release_digest: digest
              }
            });
            core.info(`Dispatched promote-production for ${sha} @ ${digest}`);
